name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Django security tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:5173
      DB_NAME: tracenet_ci
      DB_USER: tracenet_ci
      DB_PASSWORD: ci-only-dummy-password
      DB_HOST: localhost
      DB_PORT: "3306"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check --settings=config.settings_test

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Run automated tests
        run: python manage.py test cases.tests alerts.tests --settings=config.settings_test -v 2